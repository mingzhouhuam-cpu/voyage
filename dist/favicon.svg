<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Decorative subtle background circle -->
  <circle cx="256" cy="246" r="170" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="256" cy="246" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Center Emblem: Stylized Nautical Voyage Sail + Financial Monogram V -->
  <!-- Left Wing of V / Sail -->
  <path d="M 148 140 
           C 162 140, 204 265, 238 340 
           L 256 380 
           L 214 380 
           C 185 320, 132 178, 120 148 
           C 116 138, 128 140, 148 140 Z" 
        fill="url(#silverGrad)" 
        filter="url(#dropShadow)" />

  <!-- Right Wing of V / Soaring Growth Wing -->
  <path d="M 364 140 
           C 350 140, 308 265, 274 340 
           L 256 380 
           L 298 380 
           C 327 320, 380 178, 392 148 
           C 396 138, 384 140, 364 140 Z" 
        fill="url(#silverGrad)" 
        filter="url(#dropShadow)" />

  <!-- Center Dynamic V-Crest (Golden Voyage Apex) -->
  <path d="M 256 120 
           L 296 220 
           L 256 350 
           L 216 220 Z" 
        fill="url(#goldGrad)" 
        filter="url(#dropShadow)" />

  <!-- Central Currency Star / Sparkle of Prosperity -->
  <circle cx="256" cy="235" r="18" fill="#ffffff" filter="url(#glow)" />
  <polygon points="256,205 262,228 285,235 262,242 256,265 250,242 227,235 250,228" fill="url(#goldGrad)" />

  <!-- Subtitle: VOYAGE -->
  <text x="256" y="432" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#ffffff" 
        style="text-transform: uppercase; opacity: 0.95;">VOYAGE</text>
  <text x="256" y="458" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#fef08a" 
        style="opacity: 0.88;">财务管理 · PWA</text>
</svg>